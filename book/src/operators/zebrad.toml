# zebrad config paired with zingod.toml (Testnet). Omitted keys take zebrad's defaults.
# Run: zebrad -c zebrad.toml start

[network]
network = "Testnet"

[rpc]
# zingod's [[trusted_validators]] jsonrpc_address
listen_addr = "127.0.0.1:18232"
# true → zebrad writes <cookie_dir>/.cookie on each start; zingod reads it again when refused (default
# cookie_dir, same user, loopback: found unset; else zingod's cookie_path)
enable_cookie_auth = false
cookie_dir = "<PATH_TO_ZEBRA>"

[state]
cache_dir = "<PATH_TO_ZEBRA>"
