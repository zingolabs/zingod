[package]
name = "zingod-grpc-snapshot"
publish.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "One published GrpcSnapshot of what Zingod serves: chain, indexes, mempool, validators"

[features]
# `GrpcSnapshots::fixed`
testing = []

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[dependencies]
arc-swap.workspace = true
bytes.workspace = true
metrics.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
zingod-chainview.workspace = true
zingod-header-chain.workspace = true
zingod-nfs.workspace = true
zingod-persistence.workspace = true
zingod-primitives.workspace = true
zingod-source.workspace = true
zingod-sync.workspace = true
zingod-traffic.workspace = true
zcash_protocol.workspace = true
zcash_transparent.workspace = true

[dev-dependencies]
futures.workspace = true
metrics-exporter-prometheus.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
zingod-chainview = { workspace = true, features = ["testing"] }
zingod-header-chain = { workspace = true, features = ["testing"] }
zingod-internal-block-hash-to-height.workspace = true
zingod-nfs = { workspace = true, features = ["testing"] }
zingod-persistence = { workspace = true, features = ["testing"] }
zingod-source = { workspace = true, features = ["testing"] }
zingod-sync = { workspace = true, features = ["testing"] }
