[package]
name = "zingod-header-chain"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Validated Header tree: the most-work tip above a trusted anchor"

[dependencies]
equihash = "0.3"
imbl.workspace = true
thiserror.workspace = true
zingod-primitives.workspace = true
zingod-source = { workspace = true, optional = true }
zcash_protocol.workspace = true

[features]
# `HeaderChain::anchored`, `HeaderChainSnapshot::{of, finalized}`, `testing::insert`
testing = ["zingod-source/testing"]

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[dev-dependencies]
const-hex.workspace = true
proptest.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde_json.workspace = true
zingod-source = { workspace = true, features = ["testing"] }
