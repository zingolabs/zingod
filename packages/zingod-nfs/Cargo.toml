[package]
name = "zingod-nfs"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zingod's non-finalized state: the tip overlay, one folded node per block above the durable views"

[dependencies]
imbl.workspace = true
metrics.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zingod-header-chain.workspace = true
zingod-index-compact-block.workspace = true
zingod-index-transparent-address.workspace = true
zingod-index-tree-state.workspace = true
zingod-internal-block-hash-to-height.workspace = true
zingod-index-utxo-set.workspace = true
zingod-persistence.workspace = true
zingod-primitives.workspace = true
zingod-source.workspace = true
zingod-sync.workspace = true
zingod-traffic.workspace = true
zcash_protocol.workspace = true
zingod-internal-txid-location.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[features]
# `NfsPublication::fixed` (no driver) + `ChainParams::of(MockChain)`
testing = ["zingod-source/testing"]

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
zingod-header-chain = { workspace = true, features = ["testing"] }
zingod-persistence = { workspace = true, features = ["testing"] }
zingod-source = { workspace = true, features = ["testing"] }
zingod-sync = { workspace = true, features = ["testing"] }
