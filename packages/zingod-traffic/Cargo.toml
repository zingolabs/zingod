[package]
name = "zingod-traffic"
publish.workspace = true
description = "Zingod's one traffic balancer: every request to trusted validators and peers, one scheduler."
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `testing::MockPeerSet`
testing = ["zingod-source/testing"]

[dependencies]
futures.workspace = true
metrics.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util.workspace = true
tracing.workspace = true
zingod-primitives.workspace = true
zingod-source.workspace = true
zcash_protocol.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
zingod-source = { workspace = true, features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
