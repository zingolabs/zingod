# Release = this workflow, dispatched on main (RELEASING.md)
#
# - prepare: Knope's bump + CHANGELOG section as a patch, the suite on that tree, a summary to
#   review
# - publish: once a reviewer approves the `release` environment, commit (author
#   github-actions[bot]) + tag on the commit `prepare` tested, pushed over SSH as the repo's
#   deploy key (`RELEASE_DEPLOY_KEY`: the one identity the `main` and `v*` rulesets exempt; a
#   ruleset cannot exempt GITHUB_TOKEN), GitHub release from the changelog section, image
name: Release

# One release at a time; a second dispatch queues
concurrency: release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell
      # no cache statistics on the summary: that page is the release notes a reviewer approves
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          disable_annotations: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      # An environment with no required reviewers approves itself
      - name: The release environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[].type] | join(",")')
          case "$rules" in *required_reviewers*) ;; *) echo "environment 'release' has no required reviewers" >&2; exit 1 ;; esac

      - id: bump
        name: Bump + CHANGELOG.md from .changeset/
        run: |
          knope prepare-release
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '/^## / { on = ($2 == v); next } on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no ## $version section" >&2; exit 1; }
          git add -A && git diff --cached --binary > "$RUNNER_TEMP/release.patch"
          { echo "# Release $version"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: The suite, on the tree about to ship
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/notes.md
          retention-days: 7

  publish:
    name: Publish
    needs: prepare
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The dispatched commit = the one `prepare` tested; a branch that moved since makes the push
      # non-fast-forward, refused with the tag (--atomic): dispatch again
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}

      - name: Commit, tag, push
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git apply --index "$RUNNER_TEMP/release.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/release && chmod 600 ~/.ssh/release
          # GitHub's published host keys, over the authenticated API (no trust-on-first-use)
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/release -o IdentitiesOnly=yes" \
            git push --atomic "git@github.com:$GITHUB_REPOSITORY.git" "HEAD:$GITHUB_REF_NAME" "v$VERSION"

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      # X.Y.Z + `latest`
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/zingod
          tags: type=semver,pattern={{version}},value=v${{ env.VERSION }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
