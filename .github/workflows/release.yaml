# Release = this workflow, dispatched on main (RELEASING.md)
#
# - prepare: Knope's bump + CHANGELOG section as a patch, the suite on that tree, a summary to
#   review
# - publish: once a reviewer approves the `release` environment, commit + tag as
#   github-actions[bot], GitHub release from the changelog section, image to Docker Hub
# - the push is over SSH as the repo's deploy key (`RELEASE_DEPLOY_KEY`): the one identity the
#   `main` and `v*` rulesets exempt (a ruleset cannot exempt GITHUB_TOKEN)
name: Release

on:
  workflow_dispatch:
    inputs:
      override_version:
        description: Release this version instead of what the change files add up to (1.0.0 only)
        type: string
      prerelease_label:
        description: Pre-release label (`rc` → 1.0.0-rc.1); empty = stable
        type: string

permissions:
  contents: read

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      # An environment with no required reviewers approves itself
      - name: The release environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[].type] | join(",")')
          case "$rules" in *required_reviewers*) ;; *) echo "environment 'release' has no required reviewers" >&2; exit 1 ;; esac

      - id: bump
        name: Bump + CHANGELOG.md from .changeset/
        env:
          OVERRIDE: ${{ inputs.override_version }}
          LABEL: ${{ inputs.prerelease_label }}
        run: |
          args=()
          [ -n "$OVERRIDE" ] && args+=(--override-version "$OVERRIDE")
          [ -n "$LABEL" ] && args+=(--prerelease-label "$LABEL")
          knope prepare-release "${args[@]}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '/^## / { on = ($2 == v); next } on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no ## $version section" >&2; exit 1; }
          git add -A && git diff --cached --binary > "$RUNNER_TEMP/release.patch"
          { echo "# Release $version"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: The suite, on the tree about to ship
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/notes.md
          retention-days: 7

  publish:
    name: Publish
    needs: prepare
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}

      # The push refuses a branch that moved since `prepare` ran (non-fast-forward): dispatch again
      - name: Commit, tag, push
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          git apply --index "$RUNNER_TEMP/release.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/release && chmod 600 ~/.ssh/release
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/release -o IdentitiesOnly=yes" \
            git push "git@github.com:$GITHUB_REPOSITORY.git" "HEAD:$GITHUB_REF_NAME" "v$VERSION"

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $prerelease

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      # X.Y.Z, + `latest` unless a pre-release
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/zingod
          tags: type=semver,pattern={{version}},value=v${{ env.VERSION }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
