name: CI

on:
  pull_request:
  push:
    branches: [main]

# - PR push supersedes its own run
# - every main commit keeps its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# - rust-cache = registry + dependency artifacts (workspace crates excluded by design)
# - sccache (GHA cache backend) = compiled objects by content hash, workspace crates included
# - CARGO_INCREMENTAL=0: sccache skips incremental artifacts; rust-cache sets it too
env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

# every run step inside the flake devshell (flake.lock pins all tools)
defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell
      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # pre-push stage = every hook (stage-less hooks run in all stages)
      - run: pre-commit run --all-files --hook-stage pre-push

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell
      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo nextest run --locked --workspace --all-features --no-fail-fast

  features:
    name: Each feature compiles
    # main only (each package ≤ 1 feature → --each-feature = --feature-powerset)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell
      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2

      - run: cargo hack check --locked --workspace --each-feature --all-targets
        env:
          RUSTFLAGS: -D warnings
