name: Book

# - PR = build only (a broken include fails here)
# - main = build + publish to GitHub Pages (repo Settings → Pages → Source: GitHub Actions)
on:
  pull_request:
    paths: [book/**, packages/zingod-proto/proto/**, packages/zingod-proto/lightwallet-protocol/**, .github/workflows/book.yml]
  push:
    branches: [main]
    paths: [book/**, packages/zingod-proto/proto/**, packages/zingod-proto/lightwallet-protocol/**, .github/workflows/book.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      # mdbook from the flake's pinned nixpkgs (= the devshell's), without the Rust devshell
      - run: nix run --inputs-from . nixpkgs#mdbook -- build book

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/book

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
