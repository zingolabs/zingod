name: "Task"
description: Track implementation work, todos, or specific deliverables
labels: ["tracking"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for tracking specific work items, implementation tasks, or deliverables.

        Tasks are actionable items with a clear definition of done.

  # Security gate — do NOT remove.
  # Vulnerabilities must be reported privately via https://github.com/zingolabs/zingod/security
  - type: checkboxes
    id: not_a_vulnerability
    attributes:
      label: Security check
      description: >
        If this is a security vulnerability, **stop here** and
        [report it privately](https://github.com/zingolabs/zingod/security) instead.
        Public issues must not contain vulnerability details.
      options:
        - label: This issue is **not** a security vulnerability.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Task description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed? Link to parent issues or discussions if relevant.
      placeholder: |
        Part of #123
        Related to the X migration...

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know when this is done?
      placeholder: |
        - [ ] Implement X
        - [ ] Add tests for Y
        - [ ] Update documentation

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the codebase?
      multiple: true
      options:
        - zingod
        - zingod-chainview
        - zingod-grpc
        - zingod-header-chain
        - zingod-index-compact-block
        - zingod-index-transparent-address
        - zingod-index-tree-state
        - zingod-index-utxo-set
        - zingod-internal-block-hash-to-height
        - zingod-nfs
        - zingod-peers
        - zingod-persistence
        - zingod-primitives
        - zingod-proto
        - zingod-grpc-snapshot
        - zingod-source
        - zingod-sync
        - zingod-traffic
        - Testing / CI
        - Documentation
        - Other
