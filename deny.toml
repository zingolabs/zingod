[graph]
targets = []
all-features = false
no-default-features = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# TLS = rustls + aws-lc-rs only (gRPC termination in zingod-grpc, mTLS to a validator's indexer)
# - ring = banned (project policy: no ring crypto anywhere in the graph)
deny = [
    { crate = "openssl", reason = "No system TLS stack: TLS is rustls + aws-lc-rs" },
    { crate = "openssl-sys", reason = "No system TLS stack: TLS is rustls + aws-lc-rs" },
    { crate = "boring", reason = "No system TLS stack: TLS is rustls + aws-lc-rs" },
    { crate = "boring-sys", reason = "No system TLS stack: TLS is rustls + aws-lc-rs" },
    { crate = "native-tls", reason = "No system TLS stack: TLS is rustls + aws-lc-rs" },
    { crate = "ring", reason = "No ring crypto: rustls / tokio-rustls / rcgen / tonic on their aws_lc_rs features" },
]
