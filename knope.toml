# One package = the workspace: every crate shares `[workspace.package] version` (RELEASING.md)
[package]
versioned_files = [
    "Cargo.toml",
    { path = "Cargo.toml", dependency = "zingod-chainview" },
    { path = "Cargo.toml", dependency = "zingod-grpc" },
    { path = "Cargo.toml", dependency = "zingod-header-chain" },
    { path = "Cargo.toml", dependency = "zingod-index-compact-block" },
    { path = "Cargo.toml", dependency = "zingod-index-transparent-address" },
    { path = "Cargo.toml", dependency = "zingod-index-tree-state" },
    { path = "Cargo.toml", dependency = "zingod-internal-block-hash-to-height" },
    { path = "Cargo.toml", dependency = "zingod-internal-txid-location" },
    { path = "Cargo.toml", dependency = "zingod-index-utxo-set" },
    { path = "Cargo.toml", dependency = "zingod-nfs" },
    { path = "Cargo.toml", dependency = "zingod-peers" },
    { path = "Cargo.toml", dependency = "zingod-persistence" },
    { path = "Cargo.toml", dependency = "zingod-primitives" },
    { path = "Cargo.toml", dependency = "zingod-proto" },
    { path = "Cargo.toml", dependency = "zingod-grpc-snapshot" },
    { path = "Cargo.toml", dependency = "zingod-source" },
    { path = "Cargo.toml", dependency = "zingod-sync" },
    { path = "Cargo.toml", dependency = "zingod-traffic" },
    { path = "Cargo.lock", dependency = "zingod-chainview" },
    { path = "Cargo.lock", dependency = "zingod-grpc" },
    { path = "Cargo.lock", dependency = "zingod-header-chain" },
    { path = "Cargo.lock", dependency = "zingod-index-compact-block" },
    { path = "Cargo.lock", dependency = "zingod-index-transparent-address" },
    { path = "Cargo.lock", dependency = "zingod-index-tree-state" },
    { path = "Cargo.lock", dependency = "zingod-internal-block-hash-to-height" },
    { path = "Cargo.lock", dependency = "zingod-internal-txid-location" },
    { path = "Cargo.lock", dependency = "zingod-index-utxo-set" },
    { path = "Cargo.lock", dependency = "zingod-nfs" },
    { path = "Cargo.lock", dependency = "zingod-peers" },
    { path = "Cargo.lock", dependency = "zingod-persistence" },
    { path = "Cargo.lock", dependency = "zingod-primitives" },
    { path = "Cargo.lock", dependency = "zingod-proto" },
    { path = "Cargo.lock", dependency = "zingod-grpc-snapshot" },
    { path = "Cargo.lock", dependency = "zingod-source" },
    { path = "Cargo.lock", dependency = "zingod-sync" },
    { path = "Cargo.lock", dependency = "zingod-traffic" },
    { path = "Cargo.lock", dependency = "zingod" },
]
changelog = "CHANGELOG.md"
extra_changelog_sections = [{ name = "Internal", types = ["internal"] }]

# Changesets only: commit messages never bump the version
[changes]
ignore_conventional_commits = true

[github]
owner = "zingolabs"
repo = "zingod"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

# Bump + changelog from `.changeset/`, commit, push, then the GitHub release + `v$version` tag
[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: release $version\""

[[workflows.steps]]
type = "Command"
command = "git push"

[[workflows.steps]]
type = "Release"
